server {
   listen       80;
   server_name  _;

   root  /usr/share/nginx/html;
   index index.html;

   # Los .mp4 de las secciones experience/reserve se piden por rangos.
   sendfile           on;
   tcp_nopush         on;
   max_ranges         1;

   gzip              on;
   gzip_vary         on;
   gzip_min_length   1024;
   gzip_types        text/plain text/css text/javascript application/javascript
                     application/json image/svg+xml;

   # /reserva -> reserva.html. No es una SPA: lo desconocido debe dar 404,
   # no un index.html con status 200.
   location / {
      try_files $uri $uri.html $uri/ =404;
   }

   location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
   }

   # El HTML cambia en cada deploy y no lleva ?v=: no cachear
   # (mismo problema que documenta devserver.py, resuelto en producción).
   location ~* \.html$ {
      add_header Cache-Control "no-cache";
   }

   # CSS/JS ya vienen versionados por query string (?v=8) desde index.html.
   location ~* \.(css|js)$ {
      expires 7d;
      add_header Cache-Control "public";
   }

   location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|webm|woff2?)$ {
      expires 30d;
      add_header Cache-Control "public";
      access_log off;
   }

   location ~ /\. {
      deny all;
   }
}
